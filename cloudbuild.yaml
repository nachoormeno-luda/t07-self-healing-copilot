# Cloud Build pipeline: offline tests + golden eval (live Gemini) + deploy/update on Vertex AI Agent Runtime.
# Runs inside the GCP project with the Cloud Build service agent (no exported keys needed).
#
# Trigger manually (updates the engine recorded in .deployed_agent.json so no duplicate agent is created):
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_SEED_PACK=t07,_AGENT_RESOURCE="$(jq -r .resource_name .deployed_agent.json)"
steps:
  - name: "ghcr.io/astral-sh/uv:python3.12-bookworm"
    id: "test-eval-deploy"
    entrypoint: "bash"
    env:
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID"
      - "GOOGLE_GENAI_USE_VERTEXAI=1"
      - "GOOGLE_CLOUD_LOCATION=global"
      - "GEMINI_MODEL=gemini-3.8-flash"
      - "AGENT_RUNTIME_LOCATION=europe-west1"
      - "SEED_PACK=${_SEED_PACK}"
      - "BQ_LOCATION=EU"
    args:
      - "-c"
      - |
        set -euo pipefail
        uv venv --python 3.12 .venv
        uv pip install --python .venv/bin/python -r pyproject.toml
        .venv/bin/pytest -q
        .venv/bin/python -m eval.run_eval --pack "${_SEED_PACK}" --validate-only
        .venv/bin/python -m eval.run_eval --pack "${_SEED_PACK}"
        echo "{\"resource_name\": \"${_AGENT_RESOURCE}\", \"project_id\": \"$PROJECT_ID\"}" > .deployed_agent.json
        .venv/bin/python -m deploy.deploy --pack "${_SEED_PACK}"
        .venv/bin/python -m deploy.test_remote
substitutions:
  _SEED_PACK: "t07"
  _AGENT_RESOURCE: ""
timeout: "1800s"
options:
  logging: CLOUD_LOGGING_ONLY
